# running GHDL (including cocotb) simulations for surf.
# surf.exclude= [
#     "./submodules/surf/build/**/*.vhd"
# ]

axi_soc_7000_core.files = [
    "./submodules/axi-soc-7000-core/shared/rtl/*.vhd",
    "./submodules/axi-soc-7000-core/hardware/RedPitayaStemlab125-14/rtl/*.vhd",
    # "./submodules/axi-soc-7000-core/shared/utility/**/rtl/*.vhd"
]

top.files = [
    "./targets/AbortTriggerDaqRptyStmlb125_14/hdl/*.vhd",
    "./shared/rtl/*.vhd",
    "./shared/tb/*.vhd",
]

unisim.files = [
    '$XILINX_VIVADO/data/vhdl/src/unisims/unisim_VCOMP.vhd',
    '$XILINX_VIVADO/data/vhdl/src/unisims/primitive/*.vhd*',
]
unisim.is_third_party = true

